# gremlins mutation-testing config (go-gremlins). Discovered automatically at the repo root, so
# `gremlins unleash ./internal/<pkg>/` uses these without repeating flags. Override any value on the CLI.
#
# NOTE: gremlins reads these keys under the `unleash` command (viper keys `unleash.workers`, etc.), so they
# MUST be nested under `unleash:` — top-level keys are silently ignored (verified: a top-level `dry-run: true`
# runs a full test pass, while `unleash.dry-run: true` triggers a dry run).
#
# Why these values (measured on this 10-core machine, 2026-09-03):
#   - This repo's slow packages (internal/status, internal/fsm/…) run REAL git/subprocess integration tests:
#     the status suite EXECUTES in ~13s (a recompile is only ~0.1s — the cost is runtime, not build).
#   - gremlins derives each mutant's timeout from a baseline it measures with a WARM test cache (~0.3s), but
#     every mutant runs cache-MISS (~13s). An explicit `--timeout-coefficient 30` gave a ~8s ceiling < 13s, so
#     mutants on the slow packages TIMED OUT en masse (inconclusive, NOT killed — and efficacy ignores
#     timeouts, so it read a false "100%"). A large coefficient makes the ceiling comfortably exceed the real
#     runtime (incl. worker contention).
#   - workers: 8 uses the 10 cores (leaving headroom for the OS + git subprocesses) instead of serializing.
#   - test-cpu: 2 caps GOMAXPROCS per test run so 8 concurrent runs don't oversubscribe the 10 cores.
#
# Verified on internal/status (auto-discovered, no flags): Killed 119, Lived 0, Timed out 0, efficacy 100%,
# in ~38s. Fast, unit-only packages finish quickly regardless; the high coefficient only raises a ceiling, it
# does not slow a mutant that resolves fast. On a machine with fewer cores, lower `workers` (and you may lower
# the coefficient toward the point where baseline×coeff still exceeds the slowest package's execution time).
unleash:
  workers: 8
  test-cpu: 2
  timeout-coefficient: 150
