version: "2"

# The default set — errcheck, govet, ineffassign, staticcheck, unused — is what
# this repo wants: it catches discarded errors, dead code and the mistakes a
# reviewer should not have to spend attention on. No linter is disabled, and
# nothing is excluded: the noisy cases were fixed at the source instead.
linters:
  default: standard
  enable:
    # A suppression is a hole in a gate, so it has to explain itself and it must not outlive what
    # it suppressed. nolintlint requires a reason on every //nolint and reports any directive that
    # no longer suppresses anything - the "expired exception" problem, already solved here rather
    # than reinvented for our own lints.
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

issues:
  # Report everything. The defaults cap output at three issues per linter,
  # which hides the tail and makes a clean run look like a fixed run.
  max-issues-per-linter: 0
  max-same-issues: 0
