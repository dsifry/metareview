name: GTG

# Merge-readiness check. Runs on PRs and can be dispatched manually.
# See: https://github.com/dsifry/goodtogo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check"
        required: true
        type: number

permissions:
  pull-requests: read
  contents: read
  checks: read
  statuses: read

concurrency:
  group: gtg-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gtg-check:
    name: Merge Ready (gtg)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # gtg is otherwise API-driven and needs no working tree, but setup-python's pip cache keys on a
      # file that must exist in the workspace — so check out just this workflow file (a few seconds,
      # far less than the ~1 min pip download the cache saves).
      - name: Checkout (for the cache key file)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/workflows/gtg.yml
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          # Cache the pip download dir so `pip install gtg==<pinned>` restores the wheel instead of
          # re-downloading it on every run (~1 min of dead time per gtg check). Keyed on this workflow
          # file, which carries the pinned gtg version — bump the pin and the cache key rotates.
          cache: pip
          cache-dependency-path: .github/workflows/gtg.yml

      - name: Install gtg
        run: |
          # Pinned: this workflow maps gtg's --semantic-codes exit codes to
          # warnings and failures, so an unpinned release could change what the
          # gate means without a change in this repository. Verified as
          # github.com/dsifry/goodtogo rather than the unrelated PyPI names.
          pip install 'gtg==0.10.0' || {
            echo "::error::Failed to install gtg from PyPI"
            exit 1
          }

      - name: Determine PR number
        id: pr
        env:
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          else
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # Ask the API directly rather than parsing `gh pr checks`, whose error
          # text on "no checks yet" contains no "pending" line and would otherwise
          # read as "everything finished" — letting gtg run before CI reports.
          # The head SHA is resolved inside the loop rather than here: a bare
          # assignment from a failed `gh api` ends the step under `bash -e`,
          # before any of the retry budget has been spent.
          SHA=""
          # Counts only the iterations spent waiting for an ABSENT review bot, after every other
          # check has finished. See the grace window below.
          BOTWAIT=0
          # 132 * 10s = 22 minutes, which clears the Test job's own 20-minute
          # ceiling. A shorter wait would start gtg while CI was still pending
          # and report a false CI_FAILING.
          echo "Waiting for the PR head SHA and its checks ..."
          for i in $(seq 1 132); do
            if [ -z "$SHA" ]; then
              SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha || true)"
              if [ -z "$SHA" ]; then
                echo "  head SHA unavailable, retrying in 10s... ($i/132)"; sleep 10; continue
              fi
              echo "  head SHA $SHA"
            fi
            RUNS="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.name != "Merge Ready (gtg)") | "\(.name)\t\(.status)"' || echo "api-error")"
            if [ "$RUNS" = "api-error" ]; then
              echo "  API error, retrying in 10s... ($i/132)"; sleep 10; continue
            fi
            TOTAL="$(printf '%s\n' "$RUNS" | grep -c . || true)"
            if [ "$TOTAL" -eq 0 ]; then
              # printf of an empty string still emits one blank line, which grep -vc counted as a
              # pending check: the log read "1 of 0 check(s) still running". It waits either way,
              # but a gate whose own diagnostics are wrong is hard to trust when it matters.
              PENDING=0
            else
              PENDING="$(printf '%s\n' "$RUNS" | grep -vc 'completed$' || true)"
            fi
            # The review bots are WAITED FOR here, and excluded only from the pass/fail judgement
            # below. Excluding them from the wait as well is what made this gate report on a
            # moment before the reviewers had spoken: on #27 it asked "Threads: 0/0 resolved"
            # 3m10s before the first thread existed, and passed. One exclusion list was serving
            # two incompatible purposes — do not fail on a bot's check state (wanted), and do not
            # wait for it (not wanted).
            MISSING=""
            for bot in "CodeRabbit" "Cursor Bugbot"; do
              printf '%s\n' "$RUNS" | cut -f1 | grep -qxF "$bot" || MISSING="$MISSING $bot"
            done
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ] && [ -z "$MISSING" ]; then
              echo "All CI checks complete ($TOTAL), reviewers included."
              exit 0
            fi
            # A bot that has not posted a check yet is INVISIBLE to a "wait for what is present"
            # loop, so waiting on presence alone would still exit before it arrived. It is also
            # legitimately absent when a bot is uninstalled, rate-limited, or skipped on a fork —
            # so absence is given a grace period and then proceeds loudly rather than hanging for
            # the full budget.
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ] && [ -n "$MISSING" ]; then
              # The grace window is counted from the moment the OTHER checks finished, not from
              # the start of the wait. Measuring it with $i spent the window on `test`: after five
              # minutes of ordinary CI an absent bot proceeded on the very first look, which is
              # the same too-early snapshot this change exists to fix, wearing the fix's clothes.
              BOTWAIT=$((BOTWAIT + 1))
              if [ "$BOTWAIT" -ge 30 ]; then
                echo "::warning::Proceeding without review bot check(s):$MISSING — thread state may be incomplete"
                exit 0
              fi
              echo "  waiting for review bot(s) to report:$MISSING ($BOTWAIT/30 before proceeding)"
              sleep 10; continue
            fi
            echo "  $PENDING of $TOTAL check(s) still running, waiting 10s... ($i/132)"
            sleep 10
          done
          echo "::warning::Timed out waiting for CI checks; gtg may report them as failing"

      - name: Check PR readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          echo "Checking PR #$PR readiness..."

          set +e
          gtg "$PR" \
            --repo "$REPO" \
            --semantic-codes \
            --format text \
            --verbose \
            --exclude-checks "Merge Ready (gtg)" \
            --exclude-checks "CodeRabbit" \
            --exclude-checks "Cursor Bugbot" 2>&1 | tee gtg-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "::group::GTG Check Details"
          cat gtg-output.txt
          echo "::endgroup::"

          # Surface the verdict in the JOB SUMMARY so the reason is visible in the PR's Checks tab without
          # opening the raw log. A gtg run waits several minutes for CI + both review bots before it can
          # judge thread state, so from the outside it looks like a silent hang; when it then fails, the
          # cause ("N unresolved review threads") was previously buried in the log. This makes it prominent.
          {
            echo "## Merge Ready (gtg)"
            echo ""
            echo "gtg waits for CI and both review bots to report before judging, so a multi-minute pending window here is normal — not a hang."
            echo ""
            echo '```'
            grep -E 'READY|UNRESOLVED|CI:|Threads:|Action required:|unresolved review threads|actionable comment' gtg-output.txt || echo "(see the GTG Check Details log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case $EXIT_CODE in
            0)
              echo "::notice::PR #$PR is ready to merge"
              echo "> ✅ **Ready to merge** — CI green and all review threads resolved." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              # Exit 1 = actionable comments. gtg still classifies dismissed bot
              # review summaries as actionable, so this is a warning, not a failure.
              echo "::warning::PR may have actionable comments — review the GTG output above"
              echo "> ⚠️ **Possible actionable comments** — review the GTG output above (this is a warning, not a block)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::error::PR has unresolved review threads — see the job summary"
              # The single most common gtg failure when every other check is green.
              {
                echo "> ❌ **Blocked on unresolved review threads.** Every other check is green — gtg fails only because review threads are still open."
                echo ">"
                echo "> Fix or reply to each thread, then **mark it Resolved** (the GitHub UI's *Resolve conversation*, or \`gh api graphql … resolveReviewThread\`). gtg re-runs on the next push/sync and passes once 0 remain."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 2
              ;;
            3)
              echo "::error::PR has failing CI checks"
              echo "> ❌ **Failing CI checks** — see the checks above." >> "$GITHUB_STEP_SUMMARY"
              exit 3
              ;;
            4)
              echo "::error::Error fetching PR data from GitHub API"
              echo "> ❌ **Could not fetch PR data from the GitHub API** (transient) — re-run the check." >> "$GITHUB_STEP_SUMMARY"
              exit 4
              ;;
            *)
              echo "::error::GTG check failed with unexpected exit code: $EXIT_CODE"
              echo "> ❌ **gtg failed with unexpected exit code $EXIT_CODE.**" >> "$GITHUB_STEP_SUMMARY"
              exit $EXIT_CODE
              ;;
          esac
