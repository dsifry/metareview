name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes in-flight runs for the same ref, so stale runs cannot
# report after newer ones.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The behavioral suite runs dozens of shell scripts; without this a hung
    # script would hold a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The review gates diff against a base ref, so they need real history.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Behavioral suite
        run: npm test
